<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuRhône Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="images/favicon/favicon.svg" />
    <link rel="shortcut icon" href="images/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="images/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="NeuRhône Gallery" />
    <link rel="manifest" href="images/favicon/site.webmanifest" />

    <style>
        :root {
            --bg: #1a1a1a;
            --bg-card: #232323;
            --bg-modal: #1e1e1e;
            --text: #e8e0d8;
            --text-muted: #9a938b;
            --accent: #c4736e;
            --accent-light: #d4908b;
            --accent-dark: #a85a55;
            --cream: #f0e6da;
            --gap: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            font-weight: 300;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ─── HEADER ─── */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 28px 48px;
            position: sticky;
            top: 0;
            z-index: 100;
            background: linear-gradient(to bottom, var(--bg) 60%, transparent);
            pointer-events: none;
        }

        header > * {
            pointer-events: auto;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-group img {
            height: 200px;
            width: auto;
        }

        nav {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            transition: color 0.3s;
            position: relative;
            white-space: nowrap;
        }

        nav a:hover,
        nav a.active {
            color: var(--cream);
        }

        nav a.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            right: 0;
            height: 1.5px;
            background: var(--accent);
        }

        /* ─── LANGUAGE TOGGLE ─── */
        .lang-toggle {
            display: flex;
            align-items: center;
            gap: 0;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 4px;
            overflow: hidden;
            margin-left: 16px;
        }

        .lang-toggle button {
            background: none;
            border: none;
            color: var(--text-muted);
            font-family: 'Outfit', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.8px;
            padding: 5px 10px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .lang-toggle button.active {
            background: var(--accent);
            color: var(--cream);
        }

        .lang-toggle button:not(.active):hover {
            background: rgba(255,255,255,0.06);
            color: var(--cream);
        }

        /* ─── HERO ─── */
        .hero {
            text-align: center;
            padding: 40px 48px 48px;
        }

        .hero p {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.35rem;
            font-weight: 400;
            font-style: italic;
            color: var(--text-muted);
            max-width: 680px;
            margin: 0 auto;
            letter-spacing: 0.3px;
        }

        /* ─── GALLERY GRID ─── */
        .gallery {
            padding: 0 48px 80px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: var(--gap);
            max-width: 1600px;
            margin: 0 auto;
        }

        .gallery-item {
            position: relative;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            cursor: pointer;
            border-radius: 2px;
            background: var(--bg-card);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), filter 0.4s;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .gallery-item .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.15) 50%, transparent 100%);
            opacity: 0;
            transition: opacity 0.4s;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 24px;
        }

        .gallery-item:hover .overlay {
            opacity: 1;
        }

        .overlay .item-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--cream);
            margin-bottom: 4px;
        }

        .overlay .item-researcher {
            font-size: 0.82rem;
            color: var(--accent-light);
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* ─── MODAL / DETAIL VIEW ─── */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s, visibility 0.4s;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .modal-backdrop.open {
            opacity: 1;
            visibility: visible;
        }

        .modal-close {
            position: fixed;
            top: 24px;
            right: 32px;
            z-index: 1010;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 2rem;
            cursor: pointer;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.3s, transform 0.3s;
            font-weight: 300;
        }

        .modal-close:hover {
            color: var(--cream);
            transform: rotate(90deg);
        }

        .modal-content {
            max-width: 1600px;
            margin: 48px auto;
            padding: 0 48px 80px;
            display: grid;
            grid-template-columns: 3fr 2fr;
            gap: 56px;
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 0.5s 0.1s, transform 0.5s 0.1s;
        }

        .modal-backdrop.open .modal-content {
            opacity: 1;
            transform: translateY(0);
        }

        .modal-image-col {
            position: sticky;
            top: 48px;
            align-self: start;
            padding-top: 10vh;
        }

        .modal-image-col img {
            width: 100%;
            border-radius: 3px;
            display: block;
        }

        .modal-image-caption {
            margin-top: 16px;
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .modal-image-caption .caption-label {
            color: var(--accent);
            font-weight: 500;
            display: block;
            margin-bottom: 2px;
        }

        .modal-image-caption a {
            color: var(--accent-light);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.3s;
        }

        .modal-image-caption a:hover {
            border-bottom-color: var(--accent-light);
        }

        .modal-info-col {
            padding-top: 8px;
        }

        /* Researcher card */
        .researcher-card {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .researcher-card img {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
        }

        .researcher-card .rc-info .rc-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        .researcher-card .rc-info .rc-role {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-top: 2px;
            line-height: 1.4;
        }

        /* Interview Q&A */
        .interview-section {
            margin-bottom: 32px;
        }

        .interview-section h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--cream);
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .interview-section p {
            font-size: 0.92rem;
            line-height: 1.75;
            color: var(--text-muted);
        }

        .translation-note {
            display: block;
            font-size: 0.78rem;
            font-style: italic;
            color: var(--accent-dark);
            margin-bottom: 28px;
            opacity: 0.8;
        }

        /* ─── FOOTER ─── */
        footer {
            text-align: center;
            padding: 32px 48px;
            border-top: 1px solid rgba(255,255,255,0.06);
            color: var(--text-muted);
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }

        /* ─── ABOUT & CONTACT PAGES ─── */
        .page {
            display: none;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 48px 80px;
        }

        .page.active {
            display: block;
        }

        .page h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            font-weight: 600;
            color: var(--cream);
            margin-bottom: 24px;
        }

        .page p {
            font-size: 0.95rem;
            line-height: 1.8;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .page a {
            color: var(--accent-light);
            text-decoration: none;
        }

        /* ─── SEMAINE DU CERVEAU PAGE ─── */
        .semaine-page {
            max-width: 1200px;
        }

        .semaine-header {
            display: flex;
            gap: 48px;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .semaine-text {
            flex: 1;
        }

        .semaine-text h2 {
            margin-bottom: 24px;
        }

        .sdc-logo {
            width: 140px;
            flex-shrink: 0;
            margin-top: 12px;
            opacity: 0.9;
        }

        .semaine-meta {
            font-size: 0.88rem !important;
            color: var(--accent-light) !important;
            letter-spacing: 0.3px;
        }

        @media (max-width: 600px) {
            .semaine-header { flex-direction: column-reverse; gap: 24px; }
            .sdc-logo { width: 100px; }
        }

        .sdc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
            margin-top: 40px;
        }

        .sdc-grid img {
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: 3px;
            display: block;
        }

        /* ─── ANIMATIONS ─── */
        .gallery-item {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.6s forwards;
        }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .gallery-item:nth-child(1) { animation-delay: 0.05s; }
        .gallery-item:nth-child(2) { animation-delay: 0.12s; }
        .gallery-item:nth-child(3) { animation-delay: 0.19s; }
        .gallery-item:nth-child(4) { animation-delay: 0.26s; }
        .gallery-item:nth-child(5) { animation-delay: 0.33s; }
        .gallery-item:nth-child(6) { animation-delay: 0.40s; }
        .gallery-item:nth-child(7) { animation-delay: 0.47s; }
        .gallery-item:nth-child(8) { animation-delay: 0.54s; }
        .gallery-item:nth-child(9) { animation-delay: 0.61s; }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 900px) {
            header { padding: 20px 24px; }
            .hero { padding: 24px 24px 32px; }
            .gallery { padding: 0 24px 60px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
            .modal-content { grid-template-columns: 1fr; gap: 32px; padding: 0 24px 60px; }
            .modal-image-col { position: static; }
            nav { gap: 24px; }
        }

        @media (max-width: 580px) {
            .gallery { grid-template-columns: 1fr; }
            nav { gap: 16px; }
            nav a { font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-group">
            <img src="images/logo.png" alt="NeuRhône Gallery logo">
        </div>
        <nav>
            <a href="#" class="active" data-page="gallery" data-i18n="nav.gallery">Galerie</a>
            <a href="#" data-page="semaine" data-i18n="nav.semaine">Semaine du Cerveau</a>
            <a href="#" data-page="about" data-i18n="nav.about">À propos</a>
            <div class="lang-toggle">
                <button id="btn-fr" class="active" onclick="setLang('fr')">FR</button>
                <button id="btn-en" onclick="setLang('en')">EN</button>
            </div>
        </nav>
    </header>

    <!-- ════════ GALLERY PAGE ════════ -->
    <main id="page-gallery" class="active">
        <div class="hero">
            <p data-i18n="hero.subtitle"></p>
        </div>
        <div class="gallery" id="gallery-grid"></div>
    </main>

    <!-- ════════ ABOUT PAGE ════════ -->
    <main id="page-about" class="page">
        <h2 data-i18n="about.title"></h2>
        <p data-i18n="about.p1"></p>
        <p data-i18n="about.p2"></p>
        <p data-i18n="about.p3"></p>
        <p data-i18n="about.p4"></p>
        <p data-i18n="about.p5"></p>
    </main>

    <!-- ════════ SEMAINE DU CERVEAU PAGE ════════ -->
    <main id="page-semaine" class="page semaine-page">
        <div class="semaine-header">
            <div class="semaine-text">
                <h2 data-i18n="semaine.title"></h2>
                <p data-i18n="semaine.p1"></p>
                <p data-i18n="semaine.p3"></p>
            </div>
            <img src="images/sdc/logo-140.png" alt="Semaine du Cerveau" class="sdc-logo">
        </div>
        <div class="sdc-grid">
            <img src="images/sdc/IMG_SDC.png"   alt="">
            <img src="images/sdc/IMG_0136.png"  alt="">
            <img src="images/sdc/IMG_0166.png"  alt="">
            <img src="images/sdc/IMG_6767.png"  alt="">
        </div>
    </main>


    <!-- ════════ DETAIL MODAL ════════ -->
    <div class="modal-backdrop" id="modal">
        <button class="modal-close" id="modal-close">×</button>
        <div class="modal-content" id="modal-inner"></div>
    </div>

    <footer>
        <span data-i18n="footer.text"></span>
    </footer>

    <script>
    // ══════════════════════════════════════════════
    //  TRANSLATIONS
    // ══════════════════════════════════════════════
    const translations = {
        fr: {
            'nav.gallery': 'Galerie',
            'nav.about': 'À propos',
            'nav.contact': 'Contact',
            'hero.subtitle': 'Une galerie qui rassemble des images issues de la recherche en neurosciences menée à Lyon',
            'about.title': 'À propos',
            'about.p1': 'Projet étudiant développé dans le cadre de l\'unité d\'enseignement « Proskills » du Master 1 Neurosciences (UCBL1).',
            'about.p2': 'NeuRhône Gallery est un projet de médiation scientifique qui fait le pont entre neurosciences et art en mettant en valeur des images de recherche issues de la communauté neuroscientifique lyonnaise.',
            'about.p3': 'Chaque image raconte une histoire. Derrière chaque image se trouve un chercheur qui l\'a choisie parce qu\'elle capture quelque chose de particulier dans son travail.',
            'about.p4': 'Ce projet est né de l\'idée que l\'imagerie scientifique peut susciter l\'émerveillement et la curiosité chez tout le monde, pas seulement chez les scientifiques. Nous vous invitons à explorer, apprendre et voir le cerveau comme vous ne l\'avez jamais vu.',
            'about.p5': 'Zayneb Bellatif, Dina Ben Amar, Clara Chuzeville, Ambre Courthiau — Master 1 Neurosciences, Université Claude Bernard Lyon 1.',
            'footer.text': 'NeuRhône Gallery · Master Neurosciences · Université Claude Bernard Lyon 1',
            'error.load': 'Erreur de chargement des données. Vérifiez que data/gallery.json existe.',
            'translated.from_en': 'Réponses traduites de l\'anglais',
            'image.missing': 'Image à venir',
            'nav.semaine': 'Semaine du Cerveau',
            'semaine.title': 'NeuRhône Gallery — Semaine du Cerveau 2026',
            'semaine.p1': 'Du 10 au 23 mars 2026, nous avons exposé à la Bibliothèque Universitaire Sciences de La Doua (Villeurbanne). Pendant deux semaines, étudiants, chercheurs et visiteurs de passage ont pu déambuler parmi les images et les témoignages des chercheurs en neurosciences à Lyon, une rencontre entre le quotidien de la recherche et le grand public, au cœur du campus.',
        },
        en: {
            'nav.gallery': 'Gallery',
            'nav.about': 'About Us',
            'nav.contact': 'Contact',
            'hero.subtitle': 'A gallery showcasing neuroscience research images from Lyon\'s scientific community',
            'about.title': 'About Us',
            'about.p1': 'A student project developed for the "Proskills" teaching unit of the Master 1 Neurosciences program (UCBL1).',
            'about.p2': 'NeuRhône Gallery is a science outreach project that bridges neuroscience and art by showcasing research visuals from Lyon\'s neuroscience community.',
            'about.p3': 'Each image tells a story. Behind every image is a researcher who chose it because it captures something special about their work.',
            'about.p4': 'This project was born from the idea that scientific imagery can inspire awe and curiosity in anyone, not just scientists. We invite you to explore, learn, and see the brain like you never have before.',
            'about.p5': 'Zayneb Bellatif, Dina Ben Amar, Clara Chuzeville, Ambre Courthiau — Master 1 Neurosciences, Université Claude Bernard Lyon 1.',
            'footer.text': 'NeuRhône Gallery · Master Neurosciences · Université Claude Bernard Lyon 1',
            'error.load': 'Failed to load data. Please check that data/gallery.json exists.',
            'translated.from_fr': 'Interview responses translated from French',
            'image.missing': 'Image coming soon',
            'nav.semaine': 'Semaine du Cerveau',
            'semaine.title': 'NeuRhône Gallery — Semaine du Cerveau 2026',
            'semaine.p1': 'From March 10 to 23, 2026, we exhibited at the Science Library of La Doua (Villeurbanne). For two weeks, students, researchers and passing visitors could wander among the images and the testimonies of neuroscience researchers in Lyon — a meeting between the everyday reality of research and the general public, at the heart of the campus.',
        }
    };

    // ══════════════════════════════════════════════
    //  LANGUAGE STATE
    // ══════════════════════════════════════════════
    let currentLang = localStorage.getItem('neurhone-lang') || 'fr';
    let galleryData = [];
    let currentModalItem = null;

    function t(key) {
        return (translations[currentLang] && translations[currentLang][key]) || key;
    }

    function L(obj) {
        if (!obj || typeof obj === 'string') return obj || '';
        return obj[currentLang] || obj.fr || obj.en || '';
    }

    function setLang(lang) {
        if (lang === currentLang) return;
        currentLang = lang;
        localStorage.setItem('neurhone-lang', lang);
        document.documentElement.lang = lang;

        document.getElementById('btn-fr').classList.toggle('active', lang === 'fr');
        document.getElementById('btn-en').classList.toggle('active', lang === 'en');

        applyStaticTranslations();

        if (galleryData.length) renderGallery();

        if (currentModalItem) {
            renderModalContent(currentModalItem);
        }
    }

    function applyStaticTranslations() {
        document.querySelectorAll('[data-i18n]').forEach(el => {
            el.textContent = t(el.dataset.i18n);
        });
    }

    // ══════════════════════════════════════════════
    //  LOAD DATA & RENDER
    // ══════════════════════════════════════════════
    const grid = document.getElementById('gallery-grid');
    const modal = document.getElementById('modal');
    const modalInner = document.getElementById('modal-inner');
    const modalClose = document.getElementById('modal-close');

    document.documentElement.lang = currentLang;
    document.getElementById('btn-fr').classList.toggle('active', currentLang === 'fr');
    document.getElementById('btn-en').classList.toggle('active', currentLang === 'en');

    fetch('data/gallery.json')
        .then(res => res.json())
        .then(data => {
            galleryData = data;
            applyStaticTranslations();
            renderGallery();
            const match = window.location.hash.match(/^#image-(\d+)$/);
            if (match) {
                const item = galleryData.find(d => d.id === parseInt(match[1]));
                if (item) openModal(item);
            }
        })
        .catch(err => {
            applyStaticTranslations();
            grid.innerHTML = `<p style="color:var(--text-muted);text-align:center;grid-column:1/-1;">${t('error.load')}</p>`;
            console.error('Failed to load gallery data:', err);
        });

    function renderGallery() {
        grid.innerHTML = '';
        galleryData.forEach((item, i) => {
            const div = document.createElement('div');
            div.className = 'gallery-item';
            div.style.animationDelay = `${0.05 + i * 0.07}s`;
            const title = L(item.title);
            div.innerHTML = `
                <img src="${item.image}" alt="${title}" loading="lazy"
                     onerror="this.style.background='#2a2a2a';this.alt='${t('image.missing')}'">
                <div class="overlay">
                    <div class="item-title">${title}</div>
                    <div class="item-researcher">${item.researcher.name}</div>
                </div>
            `;
            div.addEventListener('click', () => openModal(item));
            grid.appendChild(div);
        });
    }

    // ══════════════════════════════════════════════
    //  MODAL
    // ══════════════════════════════════════════════
    function renderModalContent(item) {
        const lang = currentLang;
        const otherLang = lang === 'fr' ? 'en' : 'fr';

        const hasTranslation = item.interview.some(q => q.answer.original && q.answer.original !== lang);
        const noteKey = lang === 'en' ? 'translated.from_fr' : 'translated.from_en';
        const translationBanner = hasTranslation
            ? `<span class="translation-note">— ${t(noteKey)}</span>`
            : '';

        const interviewHTML = item.interview.map(q => {
            const answer = q.answer;
            const answerText = answer[lang] || answer[otherLang] || '';
            return `
                <div class="interview-section">
                    <h3>${L(q.question)}</h3>
                    <p>${answerText}</p>
                </div>
            `;
        }).join('');

        const desc = L(item.description);
        modalInner.innerHTML = `
            <div class="modal-image-col">
                <img src="${item.image}" alt="${L(item.title)}"
                     onerror="this.style.background='#2a2a2a'">
                <div class="modal-image-caption">
                    ${desc ? `<span class="caption-label">${desc}</span>` : ''}
                    ${item.articleLink && item.articleLink !== '#'
                        ? `<a href="${item.articleLink}" target="_blank">${item.articleLabel || ''}</a>`
                        : `<span style="color:var(--text-muted)">${item.articleLabel || ''}</span>`
                    }
                </div>
            </div>
            <div class="modal-info-col">
                <div class="researcher-card">
                    <div class="rc-info">
                        <div class="rc-name">${item.researcher.name}</div>
                        <div class="rc-role">${L(item.researcher.role)}</div>
                    </div>
                </div>
                ${translationBanner}
                ${interviewHTML}
            </div>
        `;
    }

    function openModal(item) {
        currentModalItem = item;
        renderModalContent(item);
        modal.classList.add('open');
        document.body.style.overflow = 'hidden';
        window.location.hash = `image-${item.id}`;
    }

    function closeModal() {
        modal.classList.remove('open');
        document.body.style.overflow = '';
        currentModalItem = null;
        history.replaceState(null, '', window.location.pathname);
    }

    modalClose.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

    // ══════════════════════════════════════════════
    //  PAGE NAVIGATION
    // ══════════════════════════════════════════════
    document.querySelectorAll('nav a[data-page]').forEach(link => {
        link.addEventListener('click', (e) => {
            e.preventDefault();
            const page = link.dataset.page;

            document.querySelectorAll('nav a[data-page]').forEach(a => a.classList.remove('active'));
            link.classList.add('active');

            document.querySelectorAll('main').forEach(m => {
                m.classList.remove('active');
                m.style.display = 'none';
            });

            const target = document.getElementById(`page-${page}`);
            if (target) {
                target.style.display = '';
                target.classList.add('active');
            }
        });
    });

    // Init
    applyStaticTranslations();
    document.getElementById('page-about').style.display = 'none';
    document.getElementById('page-semaine').style.display = 'none';

    // ══════════════════════════════════════════════
    //  DEEP LINKING
    // ══════════════════════════════════════════════
    window.addEventListener('hashchange', () => {
        const match = window.location.hash.match(/^#image-(\d+)$/);
        if (match) {
            const item = galleryData.find(d => d.id === parseInt(match[1]));
            if (item) openModal(item);
        } else {
            closeModal();
        }
    });
    </script>
</body>
</html>
